name: mutasi_ku
description: "MutasiKu — Aplikasi pengelolaan mutasi aset internal (pengajuan, verifikasi, approval, dan konfirmasi)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Storage & Auth
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3

  # Network
  http: ^1.2.2
  connectivity_plus: ^6.1.1

  # Local Database (untuk offline & sinkronisasi)
  drift: ^2.22.1
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # UI & Font
  google_fonts: ^6.2.1

  # File & Document (SK SDM wajib)
  file_picker: ^8.1.6
  open_file: ^3.5.10

  # Utility
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation (Drift + Riverpod)
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.2
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/